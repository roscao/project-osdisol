# SITE SETTINGS
title: OSDISoL                          # Title in top navigation bar (navbar) and <head>
description: Infrastructură de date spațiale Open Source destinată cartografiei solului și administrării teritoriului
author: Bogdan Roșca                    # Used for copyright statement in footer
url: "https://roscao.github.io"         # No slash at the end
baseurl: "/project-osdisol"             # VERIFICĂ: corect doar dacă site-ul e publicat la roscao.github.io/project-osdisol
                                        # Dacă folosești un domeniu propriu (CNAME), pune url: "https://domeniul.tau" și baseurl: ""

# SOCIAL PROFILES
social:
  email: roscao@gmail.com
  github: roscao/project-osdisol        # Poate fi doar username sau username/repository

# THEME SETTINGS (ALL OPTIONAL)
posts_on_home: 0                        # Show x number of latest posts on homepage, can be 0
archive_permalink: /blog/               # Permalink of page using the archive.html layout, required when using post tags
# github_edit: true                     # Necesită jekyll-github-metadata; lasă comentat pe un site public de proiect
colors:
  links: "#9a7a53"                      # Color for links: use a readable color that contrasts well with dark text
  banner: "#0DC183"                     # Background color for page banners: use color that contrasts well with white
  footer: "#9a7a53"                     # Background color for footer: use color that contrasts well with white
font_serif: true                        # Font type for page content: serif (default) or slightly smaller sans-serif
rounded_corners: true                   # Enable (default) rounded corners on boxes and buttons
logo: /assets/img/uefiscdi-logo.png     # Logo in navbar, will be displayed with 30px height
logo_and_title: true                    # If logo is enabled, show title as well (default)

# BUILD SETTINGS
markdown: kramdown
plugins:                                # If you build your site on gh-pages, only use these plugins: https://pages.github.com/versions/
  - jekyll-feed
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - LICENSE
  - package-lock.json
  - package.json
  - jekyll-theme-petridish.gemspec
  - CITATION.cff

# FRONTMATTER DEFAULTS
defaults:
  - scope:
      path: ""
    values:
      layout: default                   # Use default.html layout by default for all files
  - scope:
      type: posts
    values:
      permalink: "/blog/:year/:slug/"   # Use /blog/yyyy/{filename}/ as permalink for all posts
